name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: 构建并冒烟测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t alpine-box:test .

      - name: 启动容器 (无 CF_TOKEN 场景)
        run: |
          mkdir -p /tmp/tkey
          ssh-keygen -q -t ed25519 -N '' -f /tmp/tkey/id_ed25519
          docker run -d --name alpine-box-test \
            --cap-drop=SYS_CHROOT --cap-drop=SETGID --cap-drop=SETUID \
            -p 127.0.0.1:2022:2022 -p 127.0.0.1:18000:3000 -p 127.0.0.1:18080:8080 -p 127.0.0.1:18090:8090 \
            -e SSH_ENABLED=true -e SSH_PORT=2022 -e SHOW_LOG=true \
            -e ADMIN_USER=ci-admin -e ADMIN_PASSWORD=ci-test-password-2026 \
            -e SSH_PUBLIC_KEY="$(cat /tmp/tkey/id_ed25519.pub)" \
            alpine-box:test
          for i in $(seq 1 20); do
            if docker exec alpine-box-test sh -c 'pgrep -f "sshd.*[l]istener" >/dev/null 2>&1'; then
              break
            fi
            sleep 2
          done

      - name: 验证 sshd / 三个工具
        run: |
          set -e
          docker exec alpine-box-test sh -c 'pgrep -f "sshd.*[l]istener" >/dev/null && echo SSHD_RUNNING'
          docker exec alpine-box-test sh -c 'tunc version && echo TUNC_OK'
          docker exec alpine-box-test sh -c 'guan version && echo GUAN_OK'
          docker exec alpine-box-test sh -c 'sshx --help >/dev/null && echo SSHX_OK'
          docker exec alpine-box-test sh -c '! pgrep -x tunc && echo TUNC_SKIPPED_OK'

      - name: 真实 SSH 登录测试
        run: |
          ssh -i /tmp/tkey/id_ed25519 -p 2022 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
            root@127.0.0.1 'echo SSH_LOGIN_OK; guan version; tunc status | head -8'

      - name: SSH over WebSocket 桥测试
        run: |
          ssh -i /tmp/tkey/id_ed25519 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -o ProxyCommand="python3 tools/wssh.py pipe --host 127.0.0.1 --port 18080" \
            root@127.0.0.1 'echo WSSH_BRIDGE_OK; guan version'

      - name: SSH over HTTP 轮询传输测试 (反代拦截 WS 时的降级路径)
        run: |
          ssh -i /tmp/tkey/id_ed25519 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -o ProxyCommand="python3 tools/wssh.py pipe --host 127.0.0.1 --port 18080 --transport poll" \
            root@127.0.0.1 'echo WSSH_POLL_OK'

      - name: wstunnel 隧道测试 (客户端 → 服务端 → sshd)
        run: |
          curl -fsSL -o /tmp/wt.tar.gz https://github.com/erebe/wstunnel/releases/download/v11.1.0/wstunnel_11.1.0_linux_amd64.tar.gz
          mkdir -p /tmp/wt && tar xzf /tmp/wt.tar.gz -C /tmp/wt && chmod +x /tmp/wt/wstunnel
          /tmp/wt/wstunnel client ws://127.0.0.1:18090 -L tcp://127.0.0.1:18081:127.0.0.1:2022 > /tmp/wt-c.log 2>&1 &
          sleep 4
          B=""
          for i in $(seq 1 10); do
            B=$(timeout 8 bash -c 'exec 3<>/dev/tcp/127.0.0.1/18081; head -c 20 <&3' 2>/dev/null | head -c 20)
            [[ "$B" == SSH-2.0* ]] && break
            sleep 2
          done
          echo "banner: ${B:-无}"
          if [[ "$B" != SSH-2.0* ]]; then
            echo "=== 客户端日志:"; cat /tmp/wt-c.log
            echo "=== 容器 wstunnel.log:"; docker exec alpine-box-test sh -c 'cat /var/log/wstunnel.log 2>/dev/null | tail -15'
            echo "=== 容器端口:"; docker exec alpine-box-test sh -c 'netstat -tln 2>/dev/null | head -12'
            echo "=== 容器进程:"; docker exec alpine-box-test sh -c 'pgrep -af wstunnel'
            echo WSTUNNEL_FAIL
            exit 1
          fi
          echo WSTUNNEL_OK

      - name: 状态页测试
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /tmp/status.html -w '%{http_code}' http://127.0.0.1:18080/ || echo 000)
            if [ "$CODE" = "200" ]; then break; fi
            sleep 2
          done
          echo "HTTP $CODE"
          cat /tmp/status.html | head -8
          grep -q 'sshd : RUNNING' /tmp/status.html || { echo STATUS_ASSERT_FAIL; exit 1; }
          grep -q 'webssh : RUNNING' /tmp/status.html || { echo WEBSSH_ASSERT_FAIL; exit 1; }
          echo STATUS_PAGE_OK

      - name: web_ssh 面板测试 (登录 + 预置本机会话)
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /tmp/webssh.html -w '%{http_code}' http://127.0.0.1:18000/ || echo 000)
            if [ "$CODE" = "200" ]; then break; fi
            sleep 2
          done
          echo "panel HTTP $CODE, body bytes: $(wc -c < /tmp/webssh.html)"
          [ "$CODE" = "200" ] || { echo WEBSSH_PANEL_FAIL; exit 1; }
          # 版本端点 (静态二进制 baked version)
          VER=$(curl -s -m 5 http://127.0.0.1:18000/api/version)
          echo "version: $VER"
          echo "$VER" | grep -q version || { echo WEBSSH_VERSION_FAIL; exit 1; }
          # 管理员登录
          LOGIN=$(curl -s -m 5 -X POST -H 'Content-Type: application/json' \
            --data '{"Username":"ci-admin","Password":"ci-test-password-2026"}' \
            http://127.0.0.1:18000/api/login)
          echo "login: $LOGIN"
          echo "$LOGIN" | grep -q '"ok":true' || { echo WEBSSH_LOGIN_FAIL; exit 1; }
          # 预置的 local-box 会话存在 (store.json, 登录后 API 亦可)
          docker exec alpine-box-test sh -c 'grep -q "local-box" /var/lib/alpine-box/webssh/store.json' \
            && echo LOCAL_SESSION_OK || { echo LOCAL_SESSION_FAIL; exit 1; }
          echo WEBSSH_PANEL_OK

      - name: 容器日志
        if: always()
        run: docker logs alpine-box-test 2>&1 | tail -40

  build-push:
    name: 构建多架构镜像并发布 GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
